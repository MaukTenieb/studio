<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<meta name="description" content="Multitrack audio studio in the browser: tracks, clips, effects, microphone recording, live search in Freesound, WAV export with credits.">
<style>
:root{
  --bg:#141312;--panel:#1d1b19;--panel2:#252220;--line:#34302c;--text:#e8e1d6;--dim:#9a9086;
  --amber:#e8a33d;--red:#d9553b;--green:#8fb35a;--blue:#5b8fb3;
  --u:clamp(28px,4.2vmin,40px);--fs:clamp(11px,1.6vmin,14px);
  --head:clamp(120px,22vw,190px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:3px;height:var(--u);min-width:var(--u);padding:0 .6em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35em}
button:hover{border-color:var(--dim)}
button.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}
button.rec.on{background:var(--red);border-color:var(--red);color:#fff}
input,select{font:inherit;color:var(--text);background:#0f0e0d;border:1px solid var(--line);border-radius:3px;height:var(--u);padding:0 .5em}
input[type=range]{height:auto;padding:0;accent-color:var(--amber);background:none;border:0;width:100%}
svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;height:100%;grid-template-rows:auto 1fr auto;grid-template-columns:1fr auto}
header{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header .grp{display:flex;gap:4px;align-items:center}
#clock{font-size:calc(var(--fs)*1.5);color:var(--amber);min-width:7.5ch;text-align:right;font-variant-numeric:tabular-nums;padding:0 .4em;background:#0c0b0a;border:1px solid var(--line);border-radius:3px;height:var(--u);display:flex;align-items:center;justify-content:flex-end}
#bpm{width:7ch;text-align:center;padding:0 .2em}
.sp{flex:1}
#meter{width:clamp(50px,9vw,110px);height:8px;background:#0c0b0a;border:1px solid var(--line);position:relative;overflow:hidden}
#meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--green) 70%,var(--amber) 85%,var(--red));width:0}
main{grid-row:2;grid-column:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
#ruler{height:calc(var(--u)*.8);flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
#ruler .corner{width:var(--head);flex:none;border-right:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px}
#ruler .corner button{height:calc(var(--u)*.7);min-width:calc(var(--u)*.7)}
#rulerC{flex:1;position:relative;overflow:hidden;cursor:pointer}
#rulerCanvas{position:absolute;left:0;top:0;height:100%}
#scroller{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
#tracks{position:relative;min-height:100%}
.track{display:flex;height:calc(var(--u)*2.75);border-bottom:1px solid var(--line)}
.thead{width:var(--head);flex:none;position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--c)}
.thead .r1{display:flex;gap:3px;align-items:center}.thead .r1 button{height:calc(var(--u)*.7);min-width:calc(var(--u)*.7);padding:0;background:none;border:0;color:var(--dim)}
.thead .name{flex:1;min-width:0;background:none;border:0;height:auto;padding:0;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.thead .r2{display:flex;gap:3px}
.thead .r2 button{height:calc(var(--u)*.8);min-width:calc(var(--u)*.8);padding:0 .3em;font-size:.9em}
.thead .r3{display:flex;gap:4px;align-items:center}
.lane{flex:1;position:relative;background-image:var(--grid);min-width:0}
.clip{position:absolute;top:3px;bottom:3px;border-radius:3px;background:color-mix(in srgb,var(--c) 30%,#1a1816);border:1px solid var(--c);overflow:hidden;cursor:grab;touch-action:none}
.clip.sel{outline:2px solid var(--text);z-index:2}
.clip canvas{position:absolute;inset:14px 0 0 0;width:100%;height:calc(100% - 14px)}
.clip b{position:absolute;left:4px;top:1px;font-weight:normal;font-size:.85em;white-space:nowrap;color:var(--text);opacity:.85;pointer-events:none}
.clip .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}
.clip .h.l{left:0}.clip .h.r{right:0}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);z-index:4;pointer-events:none;margin-left:-1px}
#loopband{position:absolute;top:0;height:100%;background:rgba(232,163,61,.06);border-left:2px solid var(--amber);border-right:2px solid var(--amber);pointer-events:none}
#addTrack{margin:8px;margin-left:calc(var(--head) + 8px)}
aside{grid-row:2/4;grid-column:2;width:clamp(240px,26vw,340px);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside nav{display:flex;border-bottom:1px solid var(--line)}
aside nav button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent}
aside nav button.on{color:var(--amber);background:none;border-bottom-color:var(--amber)}
.pane{flex:1;overflow:auto;padding:6px;display:none;flex-direction:column;gap:4px;min-height:0}
.pane.on{display:flex}
.search{display:flex;gap:4px}
.search input{flex:1;min-width:0}
.snd{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);cursor:grab;touch-action:none}
.snd:hover{border-color:var(--dim)}
.snd .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd small{color:var(--dim);white-space:nowrap}
.snd.loading{opacity:.5}
.cats{display:flex;flex-wrap:wrap;gap:4px}.cats button{height:calc(var(--u)*.8);font-size:.9em}.item{border:1px solid var(--line);border-radius:3px;padding:4px 6px;cursor:pointer;background:#191715}.item .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:var(--dim)}.files{display:flex;flex-direction:column;gap:3px;margin:3px 0 6px 10px}
.note{color:var(--dim);font-size:.9em;padding:4px 2px}
.note a{color:var(--amber)}
#ghost{position:fixed;pointer-events:none;z-index:50;padding:4px 8px;background:var(--amber);color:#1a1206;border-radius:3px;display:none;white-space:nowrap}
footer{grid-row:3;grid-column:1;display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#fx{display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--panel2);border-top:1px solid var(--line)}
#fx.on{display:flex}
#fx label{display:flex;flex-direction:column;gap:2px;width:clamp(70px,10vw,110px);color:var(--dim);font-size:.85em}
#fx .tn{color:var(--c);min-width:10ch}
dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:14px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-weight:normal;color:var(--amber);margin-bottom:8px}
dialog p{margin:6px 0;color:var(--dim)}
dialog a{color:var(--amber)}
dialog input{width:100%;margin:4px 0}
dialog .row{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}

.clip.muted{opacity:.35}
.clip svg.fades{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.clip svg.fades path{fill:none;stroke:var(--text);stroke-width:1;opacity:.35;vector-effect:non-scaling-stroke}
.clip .fh{position:absolute;top:0;width:10px;height:10px;margin:0 -5px;background:var(--text);border-radius:50%;opacity:.55;cursor:ew-resize;z-index:2}
.clip .fh.fr{left:auto}
.auto{position:absolute;inset:0;z-index:3;background:rgba(10,9,8,.35);cursor:crosshair}
.auto svg{position:absolute;inset:0;overflow:visible}
.auto path{fill:none;stroke:var(--amber);stroke-width:2}
.auto.pan path{stroke:var(--blue)}
.auto circle{fill:var(--bg);stroke:var(--amber);stroke-width:2;cursor:grab}
.auto.pan circle{stroke:var(--blue)}
#menu{position:fixed;display:none;flex-direction:column;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px;min-width:200px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
#menu button{justify-content:flex-start;border:0;background:none;height:calc(var(--u)*.85)}
#menu button:hover{background:var(--panel2)}
#menu button.dis{opacity:.35}
#menu hr{border:0;border-top:1px solid var(--line);margin:3px 0}
#fx{flex-direction:column;align-items:stretch;max-height:46vh;overflow:auto}
#fx .fxbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#fx .rack{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#fx .card{flex:none;width:clamp(130px,16vw,170px);background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--c);border-radius:3px;padding:5px;display:flex;flex-direction:column;gap:3px}
#fx .card.off{opacity:.45}
#fx .card .ch{display:flex;gap:3px;align-items:center}
#fx .card .ch b{flex:1;font-weight:normal;color:var(--c)}
#fx .card .ch button{height:calc(var(--u)*.7);min-width:calc(var(--u)*.7);padding:0}
#fx .card label{width:auto}
#fx .card label span{display:flex;justify-content:space-between}
#fx .card label i{font-style:normal;color:var(--text)}
.thead .r2 button.has{border-color:var(--c)}
#meter.clip{border-color:var(--red)}
.master{display:flex;gap:6px;align-items:center}
.master b{font-weight:normal;color:var(--dim)}
.master input{width:clamp(60px,9vw,120px)}
#lyrics{flex:1;width:100%;resize:none;background:#0f0e0d;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:8px;font:inherit;line-height:1.5;-webkit-user-select:text;user-select:text}
dialog .col{display:flex;flex-direction:column;gap:6px}
#tNote{font-size:calc(var(--fs)*4);text-align:center;color:var(--amber)}
.tbar{position:relative;height:14px;background:#0c0b0a;border:1px solid var(--line);margin:8px 0}
.tbar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--dim)}
#tNeedle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--red);left:50%}
#tNeedle.ok{background:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(var(--u)*2);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);padding:6px 12px;border-radius:3px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
#drop{position:fixed;inset:0;background:rgba(232,163,61,.12);border:3px dashed var(--amber);display:none;z-index:40;pointer-events:none}
@media (max-width:760px),(max-height:520px) and (orientation:landscape){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  aside{grid-row:4;grid-column:1;width:auto;height:min(38vh,300px);border-left:0;border-top:1px solid var(--line)}
  aside.min{height:auto}
  aside.min .pane{display:none!important}
  footer{grid-row:3}
  :root{--head:clamp(96px,28vw,150px)}
}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></symbol>
  <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 12V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v3a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-metro" viewBox="0 0 24 24"><path d="M9 3h6l4 18H5z"/><path d="M12 15l5-9"/></symbol>
  <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13M6 11l6 6 6-6M4 21h16"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16L19 4M16 16L5 4"/></symbol>
  <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-fx" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M4 21h16"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-5-5"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 15l8-8 8 8"/></symbol>
  <symbol id="i-phones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="17" y="14" width="4" height="7" rx="1"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24"><path d="M9 3v8a3 3 0 0 0 6 0V3M12 14v7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
</svg>
<div id="app">
<header>
  <div class="grp">
    <button id="bBack" title="Start"><svg><use href="#i-back"/></svg></button>
    <button id="bPlay" title="Play / Stop (Space)"><svg><use href="#i-play"/></svg></button>
    <button id="bRec" class="rec" title="Record (R)"><svg><use href="#i-rec"/></svg></button>
  </div>
  <div id="clock">1.1.1</div>
  <div class="grp">
    <input id="bpm" type="number" min="30" max="300" value="120" title="BPM">
    <button id="bMetro" title="Metronome"><svg><use href="#i-metro"/></svg></button>
    <button id="bLoop" title="Loop (L)"><svg><use href="#i-loop"/></svg></button>
    <button id="bSnap" class="on" title="Snap"><svg><use href="#i-magnet"/></svg></button>
    <button id="bCount" data-tt="countIn" title="Count-in">1234</button>
    <button id="bMon" data-tt="monitor" title="Monitoring"><svg><use href="#i-phones"/></svg></button>
    <button id="bTuner" data-tt="tuner" title="Tuner"><svg><use href="#i-fork"/></svg></button>
  </div>
  <div class="sp"></div>
  <div id="meter"><i></i></div>
  <div class="grp">
    <button id="bUndo" title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
    <button id="bNew" title="New project"><svg><use href="#i-new"/></svg></button>
    <button id="bExport" title="Export WAV + credits"><svg><use href="#i-down"/></svg>WAV</button>
    <button id="bLang" title="Language">FR</button>
  </div>
</header>
<main>
  <div id="ruler"><div class="corner">
    <button id="bZout" title="Zoom −"><svg><use href="#i-zout"/></svg></button>
    <button id="bZin" title="Zoom +"><svg><use href="#i-zin"/></svg></button>
  </div><div id="rulerC"><canvas id="rulerCanvas"></canvas></div></div>
  <div id="scroller"><div id="tracks"><div id="loopband"></div><div id="playhead"></div><div id="trackList"></div>
    <button id="addTrack"><svg><use href="#i-plus"/></svg><span data-t="track">Track</span></button></div></div>
  <div id="fx"></div>
</main>
<footer>
  <button id="bSplit" title="Split at playhead (S)"><svg><use href="#i-cut"/></svg></button>
  <button id="bDup" title="Duplicate (D)"><svg><use href="#i-dup"/></svg></button>
  <button id="bDel" title="Delete (Del)"><svg><use href="#i-del"/></svg></button>
  <span id="status" class="note"></span>
  <span class="sp"></span>
  <span class="master"><b data-t="master">Master</b><input id="mVol" type="range" min="0" max="1.2" step="0.01" title="Master volume"><select id="mPre" title="Mastering"></select><button id="mLim" class="on" title="Limiter">LIM</button></span>
</footer>
<aside id="side">
  <nav>
    <button data-p="kit" class="on" title="Kit">KIT</button>
    <button data-p="fs" title="Freesound"><svg><use href="#i-search"/></svg></button>
    <button data-p="ia" title="Internet Archive">IA</button>
    <button data-p="txt" title="Lyrics">Txt</button>
    <button data-p="mine" title="Files"><svg><use href="#i-file"/></svg></button>
    <button id="bSide" title="Panel" style="flex:0 0 var(--u)"><svg><use href="#i-panel"/></svg></button>
  </nav>
  <div class="pane on" id="p-kit"></div>
  <div class="pane" id="p-fs">
    <form class="search" id="fsForm"><input id="fsQ" placeholder="drone, metal, radio…" enterkeyhint="search"><button><svg><use href="#i-search"/></svg></button><button type="button" id="bFsKey" title="Freesound key"><svg><use href="#i-gear"/></svg></button></form>
    <div id="fsList"></div>
  </div>
  <div class="pane" id="p-ia">
    <form class="search" id="iaForm"><input id="iaQ" placeholder="rain, Mali, ballad, piano…" enterkeyhint="search"><button><svg><use href="#i-search"/></svg></button></form>
    <div id="iaCats" class="cats"></div>
    <div id="iaList"></div>
  </div>
  <div class="pane" id="p-txt"><textarea id="lyrics" data-tp="lyrics" placeholder="Lyrics, notes…"></textarea></div>
  <div class="pane" id="p-mine">
    <button id="bImport"><svg><use href="#i-file"/></svg><span data-t="import">Import audio</span></button>
    <input type="file" id="fileIn" accept="audio/*" multiple hidden>
    <div id="mineList"></div>
  </div>
</aside>
</div>
<div id="menu"></div>
<dialog id="dExport"><h3 data-t="exportT">Export</h3>
  <div class="col"><button data-x="wav" data-t="wav">WAV mix</button><button data-x="mp3" data-t="mp3">MP3 mix</button><button data-x="stems" data-t="stems">WAV stems</button></div>
  <div class="row"><button id="xClose">×</button></div></dialog>
<dialog id="dTuner"><h3 data-t="tuner">Tuner</h3><div id="tNote">–</div><div class="tbar"><i id="tNeedle"></i></div><p><span id="tHz"></span> <span id="tCents"></span></p><div class="row"><button id="tClose">×</button></div></dialog>
<div id="ghost"></div><div id="toast"></div><div id="drop"></div>
<dialog id="dKey">
  <h3>Freesound</h3>
  <p data-t="keyHelp">Personal Freesound API key. It stays in this browser.</p>
  <p><a href="https://freesound.org/apiv2/apply" target="_blank" rel="noopener">https://freesound.org/apiv2/apply</a></p>
  <input id="keyIn" placeholder="API key">
  <div class="row"><button id="keyCancel">×</button><button id="keyOk" class="on">OK</button></div>
</dialog>
<script>
"use strict";
/* ================= config & i18n ================= */
const FS_PROXY = ""; // Cloudflare worker URL, set at deploy time
const COLORS=["#e8a33d","#5b8fb3","#8fb35a","#c46fa0","#d9553b","#57b3a6","#b39a5b","#8a7cc4"];

const MASTERS={Neutral:{thr:-1,ratio:20,low:0,high:0,glue:0},Warm:{thr:-2,ratio:20,low:2,high:-2,glue:2},Punch:{thr:-3,ratio:20,low:3,high:2,glue:4},Bright:{thr:-1.5,ratio:20,low:-1,high:4,glue:2},Loud:{thr:-6,ratio:20,low:2,high:2,glue:6}};

/* ================= audio core ================= */
let ctx=null, master=null, analyser=null;
function audio(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return ctx}
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
  prepCtx(ctx).then(()=>{rebuildChains();restartIfPlaying()});
  analyser=ctx.createAnalyser();analyser.fftSize=1024;
  master=buildMaster(ctx,ctx.destination,analyser);
  return ctx;
}
function buildMaster(c,dest,tap){
  const input=c.createGain(),lo=c.createBiquadFilter(),hi=c.createBiquadFilter(),glue=c.createDynamicsCompressor(),glueG=c.createGain(),lim=c.createDynamicsCompressor(),vol=c.createGain();
  lo.type="lowshelf";lo.frequency.value=120;hi.type="highshelf";hi.frequency.value=6000;
  glue.ratio.value=2;glue.attack.value=.02;glue.release.value=.25;lim.attack.value=.001;lim.release.value=.08;lim.knee.value=0;
  input.connect(lo).connect(hi).connect(glue).connect(glueG).connect(lim).connect(vol).connect(dest);if(tap)vol.connect(tap);
  const set=()=>{const m=MASTERS[state.masterPreset]||MASTERS.Neutral;lo.gain.value=m.low;hi.gain.value=m.high;glue.threshold.value=-12-m.glue*2;glueG.gain.value=Math.pow(10,m.glue/2/20);
    lim.threshold.value=state.limiter?m.thr:0;lim.ratio.value=state.limiter?m.ratio:1;vol.gain.value=state.masterVol};
  set();return{input,set};
}
function audible(tr){const anySolo=state.tracks.some(x=>x.solo);return !tr.mute&&(!anySolo||tr.solo)}
function buildChain(c,tr,dest){
  const input=c.createGain();let node=input;const fxs=[];
  for(const f of tr.rack){if(!f.on||!FX[f.type])continue;const u=FX[f.type].make(c,f.p);node.connect(u.in);node=u.out;fxs.push([f.id,u])}
  const vol=c.createGain();vol.gain.value=tr.vol;
  const auto=c.createGain();
  const pan=c.createStereoPanner();pan.pan.value=tr.pan;
  const mute=c.createGain();mute.gain.value=audible(tr)?1:0;
  node.connect(vol).connect(auto).connect(pan).connect(mute).connect(dest);
  return{input,vol,auto,pan,mute,fx:new Map(fxs)};
}

/* ================= state ================= */
const lib=new Map();
let state=newState();
function newState(){return{bpm:120,loop:false,loopA:0,loopB:8,metro:false,snap:true,pps:80,pos:0,tracks:[],sel:null,armed:null,masterVol:.9,limiter:true,masterPreset:"Neutral",lyrics:"",countIn:false,monitor:false}}
function newTrack(name){const n=state.tracks.length;return{id:uid(),name:name||t("track")+" "+(n+1),color:COLORS[n%COLORS.length],vol:.8,pan:0,mute:false,solo:false,rack:[],auto:{vol:[],pan:[]},showAuto:null,clips:[]}}
function fixTrack(tr){tr.rack=tr.rack||[];tr.auto=tr.auto||{vol:[],pan:[]};delete tr.fx;return tr}
const spb=()=>60/state.bpm;const bar=()=>spb()*4;
const snapT=x=>state.snap?Math.round(x/(spb()/4))*(spb()/4):x;
function projEnd(){let e=0;for(const tr of state.tracks)for(const c of tr.clips)e=Math.max(e,c.start+c.len);return e}
const PROJ_KEYS=["bpm","loop","loopA","loopB","pps","tracks","masterVol","limiter","masterPreset","lyrics","countIn","monitor"];
const projJSON=()=>JSON.stringify(Object.fromEntries(PROJ_KEYS.map(k=>[k,state[k]])));

/* ================= undo ================= */
const hist=[];
function snapshot(){hist.push(projJSON());if(hist.length>80)hist.shift()}
function undo(){const s=hist.pop();if(!s)return;Object.assign(state,JSON.parse(s));state.tracks.forEach(fixTrack);state.sel=null;$("#bpm").value=state.bpm;rebuildChains();render();renderFx();save();restartIfPlaying()}

/* ================= storage ================= */
let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open("studio",1);r.onupgradeneeded=()=>{r.result.createObjectStore("snd");r.result.createObjectStore("proj")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function dbPut(store,key,val){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).put(val,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(store,key){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbAll(store){const d=await db();return new Promise((res,rej)=>{const out=[];const r=d.transaction(store).objectStore(store).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}

/* ================= sound library ================= */
function peaksOf(b,n=1500){const d=b.getChannelData(0),p=new Float32Array(n),step=Math.max(1,Math.floor(d.length/n));for(let i=0;i<n;i++){let m=0;const o=i*step;for(let j=0;j<step&&o+j<d.length;j++){const v=Math.abs(d[o+j]);if(v>m)m=v}p[i]=m}return p}
function addSound(s){s.peaks=peaksOf(s.buffer);lib.set(s.id,s);return s}
function newBuf(ch,len,sr){return audio().createBuffer(ch,Math.max(1,len),sr)}
const revCache=new Map();
function reversed(s){if(revCache.has(s.id))return revCache.get(s.id);const b=s.buffer,o=newBuf(b.numberOfChannels,b.length,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c),r=o.getChannelData(c);for(let i=0,n=d.length;i<n;i++)r[i]=d[n-1-i]}const x={buffer:o,peaks:peaksOf(o)};revCache.set(s.id,x);return x}

/* ================= DSP: time-stretch & pitch (WSOLA) ================= */
function wsola(b,speed){ // speed>1 = shorter
  const N=2048,Hs=512,Ha=Hs*speed,tol=256,ch=b.numberOfChannels,inLen=b.length,outLen=Math.floor(inLen/speed);
  const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  const out=[],norm=new Float32Array(outLen+N);for(let c=0;c<ch;c++)out.push(new Float32Array(outLen+N));
  const src=[];for(let c=0;c<ch;c++)src.push(b.getChannelData(c));const ref=src[0];
  let prevEnd=0;
  for(let k=0,o=0;o<outLen;k++,o+=Hs){
    let pos=Math.round(k*Ha);
    if(k>0){let best=0,bv=-Infinity;const tgt=prevEnd;
      for(let d=-tol;d<=tol;d+=8){const p=pos+d;if(p<0||p+N>=inLen)continue;let s=0;for(let i=0;i<N/4;i+=4)s+=ref[p+i]*(ref[tgt+i]||0);if(s>bv){bv=s;best=d}}pos+=best}
    if(pos+N>=inLen)pos=Math.max(0,inLen-N-1);
    for(let c=0;c<ch;c++){const x=src[c],y=out[c];for(let i=0;i<N;i++)y[o+i]+=x[pos+i]*win[i]}
    for(let i=0;i<N;i++)norm[o+i]+=win[i];
    prevEnd=pos+Hs;
  }
  const r=newBuf(ch,outLen,b.sampleRate);for(let c=0;c<ch;c++){const y=out[c],d=r.getChannelData(c);for(let i=0;i<outLen;i++)d[i]=norm[i]>1e-3?y[i]/norm[i]:0}
  return r;
}
function resample(b,f){ // f>1 = faster / higher
  const n=Math.floor(b.length/f),r=newBuf(b.numberOfChannels,n,b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++){const x=b.getChannelData(c),y=r.getChannelData(c);for(let i=0;i<n;i++){const p=i*f,i0=p|0,fr=p-i0;y[i]=(x[i0]||0)*(1-fr)+(x[i0+1]||0)*fr}}return r}
const pitchShift=(b,semis)=>{const f=Math.pow(2,semis/12);return resample(wsola(b,1/f),f)};
function sliceBuf(b,off,len){const s=Math.floor(off*b.sampleRate),n=Math.max(1,Math.floor(len*b.sampleRate)),r=newBuf(b.numberOfChannels,n,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)r.copyToChannel(b.getChannelData(c).subarray(s,s+n),c);return r}
function denoiseBuf(b){ // high-pass 70 Hz + spectral-free downward expander on 10 ms frames
  const r=newBuf(b.numberOfChannels,b.length,b.sampleRate),fr=Math.floor(b.sampleRate*.01);
  const ch=[];for(let c=0;c<b.numberOfChannels;c++)ch.push(b.getChannelData(c));
  const rms=[];for(let i=0;i<b.length;i+=fr){let s=0;for(let j=i;j<i+fr&&j<b.length;j++)s+=ch[0][j]*ch[0][j];rms.push(Math.sqrt(s/fr))}
  const sorted=[...rms].sort((a,b)=>a-b),floor=sorted[Math.floor(sorted.length*.1)]||0,thr=floor*3;
  const a=Math.exp(-2*Math.PI*70/b.sampleRate);
  for(let c=0;c<ch.length;c++){const x=ch[c],y=r.getChannelData(c);let px=0,py=0,g=1;
    for(let i=0;i<x.length;i++){const hp=a*(py+x[i]-px);px=x[i];py=hp;const e=rms[Math.floor(i/fr)];const tg=e<thr?Math.max(0,(e-floor)/(thr-floor+1e-9))**2:1;g+= (tg-g)*(tg<g?.002:.02);y[i]=hp*g}}
  return r;
}

/* ================= playback engine ================= */
let playing=false,recording=false,t0=0,p0=0,voices=[],chains=new Map(),schedH=null,segEnd=0;
function rebuildChains(){
  const c=audio();
  for(const ch of chains.values()){try{ch.mute.disconnect()}catch(e){}for(const u of ch.fx.values())if(u.out._t)clearTimeout(u.out._t)}
  chains.clear();for(const tr of state.tracks)chains.set(tr.id,buildChain(c,tr,master.input));
}
function updTrack(tr){const ch=chains.get(tr.id);if(!ch||!ctx)return;const now=ctx.currentTime;
  ch.vol.gain.setTargetAtTime(tr.vol,now,.01);if(!tr.auto.pan.length)ch.pan.pan.setTargetAtTime(tr.pan,now,.01);
  for(const x of state.tracks){const cx=chains.get(x.id);if(cx)cx.mute.gain.setTargetAtTime(audible(x)?1:0,now,.005)}}
function updFx(tr,f){const u=chains.get(tr.id)?.fx.get(f.id);if(u)u.set(f.p)}
function autoVal(pts,x,def){if(!pts.length)return def;if(x<=pts[0].t)return pts[0].v;for(let i=1;i<pts.length;i++)if(x<=pts[i].t){const a=pts[i-1],b=pts[i];return a.v+(b.v-a.v)*(x-a.t)/(b.t-a.t||1)}return pts[pts.length-1].v}
function schedAuto(param,pts,a,b,at,map,def){
  if(!pts.length)return;param.setValueAtTime(map(autoVal(pts,a,def)),Math.max(at,ctx.currentTime));
  for(const p of pts)if(p.t>a&&p.t<b)param.linearRampToValueAtTime(map(p.v),at+(p.t-a));
  param.linearRampToValueAtTime(map(autoVal(pts,b,def)),at+(b-a));
}
function playClip(c,tr,dest,cx,from,to,when){ // generic: works with any context
  const s=lib.get(c.snd);if(!s||c.mute)return null;
  const buf=c.rev?reversed(s).buffer:s.buffer;
  const off=c.rev?Math.max(0,s.buffer.duration-(c.off+c.len)):c.off;
  const src=cx.createBufferSource();src.buffer=buf;const g=cx.createGain();const G=c.gain??1;
  src.connect(g).connect(dest);
  const rel0=from-c.start,rel1=to-c.start,fi=c.fadeIn||0,fo=c.fadeOut||0;
  const envAt=r=>G*Math.min(fi>0?clamp(r/fi,0,1):1,fo>0?clamp((c.len-r)/fo,0,1):1);
  g.gain.setValueAtTime(envAt(rel0),when);
  if(fi>0&&rel0<fi&&fi<rel1)g.gain.linearRampToValueAtTime(envAt(fi),when+(fi-rel0));
  const foS=c.len-fo;if(fo>0&&foS>rel0){g.gain.setValueAtTime(envAt(Math.max(foS,rel0)),when+Math.max(0,foS-rel0))}
  if(fo>0)g.gain.linearRampToValueAtTime(envAt(rel1),when+(rel1-rel0));
  src.start(when,off+rel0,rel1-rel0);return src;
}
function scheduleSeg(a,b,at){
  for(const tr of state.tracks){const ch=chains.get(tr.id);if(!ch)continue;
    schedAuto(ch.auto.gain,tr.auto.vol,a,b,at,v=>v,1);schedAuto(ch.pan.pan,tr.auto.pan,a,b,at,v=>v,tr.pan);
    for(const c of tr.clips){const cs=c.start,ce=c.start+c.len;if(ce<=a||cs>=b)continue;
      const from=Math.max(a,cs),to=Math.min(b,ce);const when=Math.max(ctx.currentTime,at+(from-a));
      const src=playClip(c,tr,ch.input,ctx,from,to,when);if(src){voices.push(src);src.onended=()=>{const i=voices.indexOf(src);if(i>=0)voices.splice(i,1)}}}}
  if(state.metro||(recording&&state.countIn&&a<p0))clicks(a,b,at);
}
function clicks(a,b,at){const b0=Math.ceil(a/spb()-1e-6);for(let k=b0;k*spb()<b;k++){const tt=at+(k*spb()-a);if(tt<ctx.currentTime)continue;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=((k%4)+4)%4===0?1600:1000;g.gain.setValueAtTime(.25,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.05);o.connect(g).connect(master.input);o.start(tt);o.stop(tt+.06);voices.push(o)}}
function play(from){
  audio();rebuildChains();
  playing=true;p0=from??state.pos;t0=ctx.currentTime+.06;
  const end=Math.max(projEnd(),p0)+(recording?900:0);
  if(state.loop&&state.loopB>state.loopA&&!recording){
    if(p0>=state.loopB||p0<state.loopA)p0=state.loopA;
    scheduleSeg(p0,state.loopB,t0);segEnd=t0+(state.loopB-p0);
    schedH=setInterval(()=>{if(segEnd-ctx.currentTime<1){scheduleSeg(state.loopA,state.loopB,segEnd);segEnd+=state.loopB-state.loopA}},100);
  }else{scheduleSeg(p0,end,t0);segEnd=t0+(end-p0)}
  setPlayBtn(true);
}
function setPlayBtn(on){$("#bPlay").classList.toggle("on",on);$("#bPlay").replaceChildren(icon(on?"stop":"play"))}
function stop(){
  if(!playing)return;const pos=displayPos();
  for(const v of voices)try{v.stop()}catch(e){}voices=[];clearInterval(schedH);
  for(const ch of chains.values()){try{ch.auto.gain.cancelScheduledValues(0);ch.auto.gain.value=1;ch.pan.pan.cancelScheduledValues(0)}catch(e){}}
  playing=false;state.pos=Math.max(0,pos);
  if(recording)stopRec();
  setPlayBtn(false);placeHead();
}
function displayPos(){
  if(!playing)return state.pos;let p=p0+(ctx.currentTime-t0);
  if(state.loop&&!recording&&state.loopB>state.loopA&&p>=state.loopB)p=state.loopA+((p-state.loopB)%(state.loopB-state.loopA));
  return Math.max(0,p);
}
function restartIfPlaying(){if(playing&&!recording){const p=displayPos();stop();state.pos=p;play(p)}}

/* ================= recording ================= */
let mediaRec=null,recChunks=[],recStartPos=0,recStream=null,monNode=null;
async function getMic(){if(recStream)return recStream;recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});return recStream}
async function startRec(){
  const tr=state.tracks.find(x=>x.id===state.armed);if(!tr){toast(t("arm"));return}
  audio();try{await getMic()}catch(e){toast(t("mic"));return}
  recChunks=[];mediaRec=new MediaRecorder(recStream);mediaRec.ondataavailable=e=>e.data.size&&recChunks.push(e.data);
  const pre=state.countIn?bar():0;
  mediaRec.onstop=async()=>{
    const blob=new Blob(recChunks,{type:mediaRec.mimeType});
    try{const buf=await ctx.decodeAudioData(await blob.arrayBuffer());
      const lat=(ctx.outputLatency||ctx.baseLatency||0)+.02;
      const d=new Date(),nm="Rec "+[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
      const s=addSound({id:"rec:"+uid(),name:nm,buffer:buf,src:"rec"});storeSound(s);
      snapshot();tr.clips.push({id:uid(),snd:s.id,start:recStartPos,off:Math.min(lat+pre,buf.duration/2),len:Math.max(.05,buf.duration-lat-pre),gain:1});
      renderMine();render();save();
    }catch(e){console.warn(e)}
  };
  if(state.monitor){const ch=chains.get(tr.id)||(rebuildChains(),chains.get(tr.id));monNode=ctx.createMediaStreamSource(recStream);}
  recording=true;$("#bRec").classList.add("on");
  recStartPos=state.pos;play(Math.max(0,state.pos-pre));p0=state.pos-pre;
  if(monNode)monNode.connect(chains.get(tr.id).input);
  setTimeout(()=>mediaRec&&mediaRec.state==="inactive"&&mediaRec.start(),55);
}
function stopRec(){recording=false;$("#bRec").classList.remove("on");if(monNode){try{monNode.disconnect()}catch(e){}monNode=null}if(mediaRec&&mediaRec.state!=="inactive")mediaRec.stop()}

/* ================= offline render / export ================= */
async function renderOffline(onlyTrack){
  const end=projEnd();if(!end)return null;
  const SR=44100,len=Math.ceil((end+3)*SR);
  const oc=new OfflineAudioContext(2,len,SR);await prepCtx(oc);
  const m=buildMaster(oc,oc.destination,null);const used=new Set();
  for(const tr of state.tracks){if(onlyTrack&&tr!==onlyTrack)continue;if(!onlyTrack&&!audible(tr))continue;
    const ch=buildChain(oc,tr,onlyTrack?oc.destination:m.input);ch.mute.gain.value=1;
    if(tr.auto.vol.length){ch.auto.gain.setValueAtTime(autoVal(tr.auto.vol,0,1),0);for(const p of tr.auto.vol)ch.auto.gain.linearRampToValueAtTime(p.v,p.t)}
    if(tr.auto.pan.length){ch.pan.pan.setValueAtTime(autoVal(tr.auto.pan,0,0),0);for(const p of tr.auto.pan)ch.pan.pan.linearRampToValueAtTime(p.v,p.t)}
    for(const c of tr.clips){const s=lib.get(c.snd);if(!s||c.mute)continue;used.add(s);playClip(c,tr,ch.input,oc,c.start,c.start+c.len,c.start)}}
  const b=await oc.startRendering();return{b:trimTail(b),used};
}
function trimTail(b){let last=0;for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=d.length-1;i>last;i--)if(Math.abs(d[i])>1e-4){last=i;break}}const n=Math.min(b.length,last+Math.floor(b.sampleRate*.05));const o=new AudioBuffer({numberOfChannels:b.numberOfChannels,length:Math.max(1,n),sampleRate:b.sampleRate});for(let c=0;c<b.numberOfChannels;c++)o.copyToChannel(b.getChannelData(c).subarray(0,n),c);return o}
const stamp=()=>"studio-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
function creditsTxt(used){const cred=[...used].filter(s=>s.credit);if(!cred.length)return null;return(lang==="fr"?"Sons utilisés":"Sounds used")+"\n\n"+cred.map(s=>`"${s.credit.title}" — ${s.credit.author} — ${s.credit.license} — ${s.credit.url}`).join("\n")+"\n"}
async function doExport(kind){

  if(saved){try{Object.assign(state,JSON.parse(saved));state.tracks.forEach(fixTrack);
    const ids=new Set(state.tracks.flatMap(tr=>tr.clips.map(c=>c.snd)));for(const id of ids)if(!lib.has(id))await ensureSound({id}).catch(()=>null)}catch(e){console.warn(e)}}
  if(!state.tracks.length){for(let i=0;i<4;i++)state.tracks.push(newTrack());
    const put=(i,id,beats)=>{const s=lib.get("kit:"+id);for(const b of beats)state.tracks[i].clips.push({id:uid(),snd:s.id,start:b*spb(),off:0,len:Math.min(s.buffer.duration,spb()*2),gain:1})};
    ["Kick","Snare","Hat","Drone"].forEach((n,i)=>state.tracks[i].name=n);
    put(0,"Kick",[0,4,8,12]);put(1,"Snare",[2,6,10,14]);put(2,"Hat",[...Array(16).keys()].map(x=>x+.5));
    const d=lib.get("kit:Drone");state.tracks[3].clips.push({id:uid(),snd:d.id,start:0,off:0,len:d.buffer.duration,gain:.8,fadeIn:1,fadeOut:1.5});
    state.tracks[3].rack=[{id:uid(),type:"reverb",on:true,p:{...FX.reverb.p,mix:.5}}];state.loop=true;state.loopA=0;state.loopB=bar()*4}
  syncUI();render();requestAnimationFrame(frame);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
