<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<meta name="description" content="Multitrack audio studio in the browser: tracks, clips, effects, microphone recording, live search in Freesound, WAV export with credits.">
<style>
:root{
  --bg:#141312;--panel:#1d1b19;--panel2:#252220;--line:#34302c;--text:#e8e1d6;--dim:#9a9086;
  --amber:#e8a33d;--red:#d9553b;--green:#8fb35a;--blue:#5b8fb3;
  --u:clamp(28px,4.2vmin,40px);--fs:clamp(11px,1.6vmin,14px);
  --head:clamp(120px,22vw,190px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:var(--fs)/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:3px;height:var(--u);min-width:var(--u);padding:0 .6em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35em}
button:hover{border-color:var(--dim)}
button.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}
button.rec.on{background:var(--red);border-color:var(--red);color:#fff}
input,select{font:inherit;color:var(--text);background:#0f0e0d;border:1px solid var(--line);border-radius:3px;height:var(--u);padding:0 .5em}
input[type=range]{height:auto;padding:0;accent-color:var(--amber);background:none;border:0;width:100%}
svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;height:100%;grid-template-rows:auto 1fr auto;grid-template-columns:1fr auto}
header{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header .grp{display:flex;gap:4px;align-items:center}
#clock{font-size:calc(var(--fs)*1.5);color:var(--amber);min-width:7.5ch;text-align:right;font-variant-numeric:tabular-nums;padding:0 .4em;background:#0c0b0a;border:1px solid var(--line);border-radius:3px;height:var(--u);display:flex;align-items:center;justify-content:flex-end}
#bpm{width:7ch;text-align:center;padding:0 .2em}
.sp{flex:1}
#meter{width:clamp(50px,9vw,110px);height:8px;background:#0c0b0a;border:1px solid var(--line);position:relative;overflow:hidden}
#meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--green) 70%,var(--amber) 85%,var(--red));width:0}
main{grid-row:2;grid-column:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
#ruler{height:calc(var(--u)*.8);flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
#ruler .corner{width:var(--head);flex:none;border-right:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px}
#ruler .corner button{height:calc(var(--u)*.7);min-width:calc(var(--u)*.7)}
#rulerC{flex:1;position:relative;overflow:hidden;cursor:pointer}
#rulerCanvas{position:absolute;left:0;top:0;height:100%}
#scroller{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
#tracks{position:relative;min-height:100%}
.track{display:flex;height:calc(var(--u)*2.75);border-bottom:1px solid var(--line)}
.thead{width:var(--head);flex:none;position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--c)}
.thead .r1{display:flex;gap:3px;align-items:center}.thead .r1 button{height:calc(var(--u)*.7);min-width:calc(var(--u)*.7);padding:0;background:none;border:0;color:var(--dim)}
.thead .name{flex:1;min-width:0;background:none;border:0;height:auto;padding:0;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.thead .r2{display:flex;gap:3px}
.thead .r2 button{height:calc(var(--u)*.8);min-width:calc(var(--u)*.8);padding:0 .3em;font-size:.9em}
.thead .r3{display:flex;gap:4px;align-items:center}
.lane{flex:1;position:relative;background-image:var(--grid);min-width:0}
.clip{position:absolute;top:3px;bottom:3px;border-radius:3px;background:color-mix(in srgb,var(--c) 30%,#1a1816);border:1px solid var(--c);overflow:hidden;cursor:grab;touch-action:none}
.clip.sel{outline:2px solid var(--text);z-index:2}
.clip canvas{position:absolute;inset:14px 0 0 0;width:100%;height:calc(100% - 14px)}
.clip b{position:absolute;left:4px;top:1px;font-weight:normal;font-size:.85em;white-space:nowrap;color:var(--text);opacity:.85;pointer-events:none}
.clip .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize}
.clip .h.l{left:0}.clip .h.r{right:0}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);z-index:4;pointer-events:none;margin-left:-1px}
#loopband{position:absolute;top:0;height:100%;background:rgba(232,163,61,.06);border-left:2px solid var(--amber);border-right:2px solid var(--amber);pointer-events:none}
#addTrack{margin:8px;margin-left:calc(var(--head) + 8px)}
aside{grid-row:2/4;grid-column:2;width:clamp(240px,26vw,340px);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside nav{display:flex;border-bottom:1px solid var(--line)}
aside nav button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent}
aside nav button.on{color:var(--amber);background:none;border-bottom-color:var(--amber)}
.pane{flex:1;overflow:auto;padding:6px;display:none;flex-direction:column;gap:4px;min-height:0}
.pane.on{display:flex}
.search{display:flex;gap:4px}
.search input{flex:1;min-width:0}
.snd{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);cursor:grab;touch-action:none}
.snd:hover{border-color:var(--dim)}
.snd .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd small{color:var(--dim);white-space:nowrap}
.snd.loading{opacity:.5}
.cats{display:flex;flex-wrap:wrap;gap:4px}.cats button{height:calc(var(--u)*.8);font-size:.9em}.item{border:1px solid var(--line);border-radius:3px;padding:4px 6px;cursor:pointer;background:#191715}.item .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:var(--dim)}.files{display:flex;flex-direction:column;gap:3px;margin:3px 0 6px 10px}
.note{color:var(--dim);font-size:.9em;padding:4px 2px}
.note a{color:var(--amber)}
#ghost{position:fixed;pointer-events:none;z-index:50;padding:4px 8px;background:var(--amber);color:#1a1206;border-radius:3px;display:none;white-space:nowrap}
footer{grid-row:3;grid-column:1;display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#fx{display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--panel2);border-top:1px solid var(--line)}
#fx.on{display:flex}
#fx label{display:flex;flex-direction:column;gap:2px;width:clamp(70px,10vw,110px);color:var(--dim);font-size:.85em}
#fx .tn{color:var(--c);min-width:10ch}
dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:14px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-weight:normal;color:var(--amber);margin-bottom:8px}
dialog p{margin:6px 0;color:var(--dim)}
dialog a{color:var(--amber)}
dialog input{width:100%;margin:4px 0}
dialog .row{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--u)*2);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);padding:6px 12px;border-radius:3px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
#drop{position:fixed;inset:0;background:rgba(232,163,61,.12);border:3px dashed var(--amber);display:none;z-index:40;pointer-events:none}
@media (max-width:760px),(max-height:520px) and (orientation:landscape){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  aside{grid-row:4;grid-column:1;width:auto;height:min(38vh,300px);border-left:0;border-top:1px solid var(--line)}
  aside.min{height:auto}
  aside.min .pane{display:none!important}
  footer{grid-row:3}
  :root{--head:clamp(96px,28vw,150px)}
}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></symbol>
  <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 12V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v3a3 3 0 0 1-3 3H3"/></symbol>
  <symbol id="i-metro" viewBox="0 0 24 24"><path d="M9 3h6l4 18H5z"/><path d="M12 15l5-9"/></symbol>
  <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></symbol>

  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M4 21h16"/></symbol>
  <symbol id="i-zin" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-5-5"/></symbol>
  <symbol id="i-zout" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 15l8-8 8 8"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
</svg>
<div id="app">
<header>
  <div class="grp">
    <button id="bBack" title="Start"><svg><use href="#i-back"/></svg></button>
    <button id="bPlay" title="Play / Stop (Space)"><svg><use href="#i-play"/></svg></button>
    <button id="bRec" class="rec" title="Record (R)"><svg><use href="#i-rec"/></svg></button>
  </div>
  <div id="clock">1.1.1</div>
  <div class="grp">
    <input id="bpm" type="number" min="30" max="300" value="120" title="BPM">
    <button id="bMetro" title="Metronome"><svg><use href="#i-metro"/></svg></button>
    <button id="bLoop" title="Loop (L)"><svg><use href="#i-loop"/></svg></button>
    <button id="bSnap" class="on" title="Snap"><svg><use href="#i-magnet"/></svg></button>
  </div>
  <div class="sp"></div>
  <div id="meter"><i></i></div>
  <div class="grp">
    <button id="bUndo" title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
    <button id="bNew" title="New project"><svg><use href="#i-new"/></svg></button>
    <button id="bExport" title="Export WAV + credits"><svg><use href="#i-down"/></svg>WAV</button>
    <button id="bLang" title="Language">FR</button>
  </div>
</header>
<main>
  <div id="ruler"><div class="corner">
    <button id="bZout" title="Zoom −"><svg><use href="#i-zout"/></svg></button>
    <button id="bZin" title="Zoom +"><svg><use href="#i-zin"/></svg></button>
  </div><div id="rulerC"><canvas id="rulerCanvas"></canvas></div></div>
  <div id="scroller"><div id="tracks"><div id="loopband"></div><div id="playhead"></div><div id="trackList"></div>
    <button id="addTrack"><svg><use href="#i-plus"/></svg><span data-t="track">Track</span></button></div></div>
  <div id="fx"></div>
</main>
<footer>
  <button id="bSplit" title="Split at playhead (S)"><svg><use href="#i-cut"/></svg></button>
  <button id="bDup" title="Duplicate (D)"><svg><use href="#i-dup"/></svg></button>
  <button id="bDel" title="Delete (Del)"><svg><use href="#i-del"/></svg></button>
  <span class="sp"></span>
  <span id="status" class="note"></span>
</footer>
<aside id="side">
  <nav>
    <button data-p="kit" class="on" title="Kit">KIT</button>
    <button data-p="fs" title="Freesound"><svg><use href="#i-search"/></svg></button>
    <button data-p="ia" title="Internet Archive">IA</button>
    <button data-p="mine" title="Files"><svg><use href="#i-file"/></svg></button>
    <button id="bSide" title="Panel" style="flex:0 0 var(--u)"><svg><use href="#i-panel"/></svg></button>
  </nav>
  <div class="pane on" id="p-kit"></div>
  <div class="pane" id="p-fs">
    <form class="search" id="fsForm"><input id="fsQ" placeholder="drone, metal, radio…" enterkeyhint="search"><button><svg><use href="#i-search"/></svg></button><button type="button" id="bFsKey" title="Freesound key"><svg><use href="#i-gear"/></svg></button></form>
    <div id="fsList"></div>
  </div>
  <div class="pane" id="p-ia">
    <form class="search" id="iaForm"><input id="iaQ" placeholder="rain, Mali, ballad, piano…" enterkeyhint="search"><button><svg><use href="#i-search"/></svg></button></form>
    <div id="iaCats" class="cats"></div>
    <div id="iaList"></div>
  </div>
  <div class="pane" id="p-mine">
    <button id="bImport"><svg><use href="#i-file"/></svg><span data-t="import">Import audio</span></button>
    <input type="file" id="fileIn" accept="audio/*" multiple hidden>
    <div id="mineList"></div>
  </div>
</aside>
</div>
<div id="ghost"></div><div id="toast"></div><div id="drop"></div>
<dialog id="dKey">
  <h3>Freesound</h3>
  <p data-t="keyHelp">Personal Freesound API key. It stays in this browser.</p>
  <p><a href="https://freesound.org/apiv2/apply" target="_blank" rel="noopener">https://freesound.org/apiv2/apply</a></p>
  <input id="keyIn" placeholder="API key">
  <div class="row"><button id="keyCancel">×</button><button id="keyOk" class="on">OK</button></div>
</dialog>
<script>
"use strict";
/* ---------- config ---------- */
const FS_PROXY = ""; // Cloudflare worker URL, set at deploy time
const COLORS=["#e8a33d","#5b8fb3","#8fb35a","#c46fa0","#d9553b","#57b3a6","#b39a5b","#8a7cc4"];
const T={
 en:{track:"Track",import:"Import audio",keyHelp:"Personal Freesound API key. It stays in this browser.",noKey:"Freesound needs a key: gear button.",nores:"Nothing found.",exported:"Exported",saved:"Saved",mic:"Microphone refused.",confirmNew:"Erase the current project?",arm:"Arm a track (●) first.",fsErr:"Freesound unreachable.",drop:"Drop sounds on a track.",licence:"Licences shown: CC0 and CC BY. Credits go into the export."},
 fr:{track:"Piste",import:"Importer de l'audio",keyHelp:"Clé personnelle de l'API Freesound. Elle reste dans ce navigateur.",noKey:"Freesound demande une clé : bouton engrenage.",nores:"Rien trouvé.",exported:"Exporté",saved:"Enregistré",mic:"Micro refusé.",confirmNew:"Effacer le projet en cours ?",arm:"Arme d'abord une piste (●).",fsErr:"Freesound injoignable.",drop:"Lâche les sons sur une piste.",licence:"Licences affichées : CC0 et CC BY. Les crédits partent avec l'export."}
};
let lang=(localStorage.getItem("st.lang")||((navigator.language||"en").startsWith("fr")?"fr":"en"));
const t=k=>T[lang][k]||T.en[k]||k;
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(k==="style")e.style.cssText=attrs[k];else e.setAttribute(k,attrs[k]);}for(const c of kids)e.append(c);return e};
const icon=n=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");const u=document.createElementNS("http://www.w3.org/2000/svg","use");u.setAttribute("href","#i-"+n);s.append(u);return s};
const uid=()=>Math.random().toString(36).slice(2,10);
const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),1800)};

/* ---------- audio core ---------- */
let ctx=null, master, analyser, reverbIR=null;
function audio(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return ctx}
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
  master=ctx.createGain();analyser=ctx.createAnalyser();analyser.fftSize=1024;
  master.connect(analyser);analyser.connect(ctx.destination);
  return ctx;
}
function makeIR(c,sec=2.4){
  const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}
  return b;
}
function driveCurve(amt){const n=1024,c=new Float32Array(n),k=amt*60;for(let i=0;i<n;i++){const x=i/n*2-1;c[i]=k?((1+k)*x)/(1+k*Math.abs(x)):x}return c}
/* builds the per-track chain inside any context; returns {input, nodes} */
function buildChain(c,tr,dest,ir){
  const input=c.createGain();
  const filt=c.createBiquadFilter();filt.type="lowpass";filt.frequency.value=tr.fx.cut;filt.Q.value=tr.fx.res;
  const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=tr.fx.hp;
  const drive=c.createWaveShaper();drive.curve=driveCurve(tr.fx.drive);drive.oversample="2x";
  const dry=c.createGain();
  const dl=c.createDelay(2);dl.delayTime.value=60/state.bpm*tr.fx.dtime;
  const fb=c.createGain();fb.gain.value=tr.fx.dfb;
  const dsend=c.createGain();dsend.gain.value=tr.fx.dmix;
  const conv=c.createConvolver();conv.buffer=ir;
  const rsend=c.createGain();rsend.gain.value=tr.fx.rmix;
  const vol=c.createGain();vol.gain.value=tr.vol;
  const pan=c.createStereoPanner?c.createStereoPanner():null;if(pan)pan.pan.value=tr.pan;
  const mute=c.createGain();mute.gain.value=audible(tr)?1:0;
  input.connect(hp);hp.connect(filt);filt.connect(drive);drive.connect(dry);
  drive.connect(dsend);dsend.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(vol);
  drive.connect(rsend);rsend.connect(conv);conv.connect(vol);
  dry.connect(vol);
  if(pan){vol.connect(pan);pan.connect(mute)}else vol.connect(mute);
  mute.connect(dest);
  return {input,filt,hp,drive,dl,fb,dsend,rsend,vol,pan,mute};
}
function audible(tr){const anySolo=state.tracks.some(x=>x.solo);return !tr.mute&&(!anySolo||tr.solo)}

/* ---------- state ---------- */
const lib=new Map(); // id -> {id,name,buffer,peaks,src,credit}
let state=newState();
function newState(){return{bpm:120,loop:false,loopA:0,loopB:8,metro:false,snap:true,pps:80,pos:0,tracks:[],sel:null,armed:null}}
function newTrack(name){const n=state.tracks.length;return{id:uid(),name:name||t("track")+" "+(n+1),color:COLORS[n%COLORS.length],vol:.8,pan:0,mute:false,solo:false,fx:{cut:20000,res:.7,hp:20,drive:0,dtime:.75,dfb:.35,dmix:0,rmix:0},clips:[]}}
const spb=()=>60/state.bpm;const bar=()=>spb()*4;
const snapT=x=>state.snap?Math.round(x/(spb()/4))*(spb()/4):x;
function projEnd(){let e=0;for(const tr of state.tracks)for(const c of tr.clips)e=Math.max(e,c.start+c.len);return e}

/* ---------- undo ---------- */
const hist=[];
function snapshot(){hist.push(JSON.stringify({bpm:state.bpm,tracks:state.tracks,loopA:state.loopA,loopB:state.loopB}));if(hist.length>60)hist.shift()}
function undo(){const s=hist.pop();if(!s)return;const o=JSON.parse(s);Object.assign(state,o);state.sel=null;$("#bpm").value=state.bpm;rebuildChains();render();save()}

/* ---------- storage (IndexedDB) ---------- */
let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open("studio",1);r.onupgradeneeded=()=>{r.result.createObjectStore("snd");r.result.createObjectStore("proj")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function dbPut(store,key,val){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).put(val,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(store,key){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbAll(store){const d=await db();return new Promise((res,rej)=>{const out=[];const r=d.transaction(store).objectStore(store).openCursor();r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}
async function storeSound(s){if(s.src==="kit")return;const b=s.buffer;const chans=[];for(let i=0;i<b.numberOfChannels;i++)chans.push(b.getChannelData(i).slice());try{await dbPut("snd",s.id,{id:s.id,name:s.name,src:s.src,credit:s.credit||null,sr:b.sampleRate,chans})}catch(e){console.warn(e)}}
let saveH;
function save(){clearTimeout(saveH);saveH=setTimeout(()=>{dbPut("proj","cur",JSON.stringify({bpm:state.bpm,loop:state.loop,loopA:state.loopA,loopB:state.loopB,pps:state.pps,tracks:state.tracks})).catch(()=>{})},400)}

/* ---------- sound library ---------- */
function peaksOf(b,n=1500){const d=b.getChannelData(0),p=new Float32Array(n),step=Math.max(1,Math.floor(d.length/n));for(let i=0;i<n;i++){let m=0;const o=i*step;for(let j=0;j<step&&o+j<d.length;j++){const v=Math.abs(d[o+j]);if(v>m)m=v}p[i]=m}return p}
function addSound(s){s.peaks=peaksOf(s.buffer);lib.set(s.id,s);return s}

/* synthesized kit: rendered offline, zero licence questions */
async function renderKit(){
  const SR=44100;
  const mk=async(name,sec,fn,ch=1)=>{const c=new OfflineAudioContext(ch,Math.ceil(SR*sec),SR);fn(c);const b=await c.startRendering();return addSound({id:"kit:"+name,name,buffer:b,src:"kit"})};
  const noise=(c,sec)=>{const b=c.createBuffer(1,Math.ceil(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s};
  const env=(c,g,a,d,peak=1)=>{g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(peak,a);g.gain.exponentialRampToValueAtTime(.0001,a+d)};
  const list=[
   ["Kick",.6,c=>{const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,0);o.frequency.exponentialRampToValueAtTime(42,.12);env(c,g,.002,.5);o.connect(g).connect(c.destination);o.start()}],
   ["Hard kick",.5,c=>{const o=c.createOscillator(),g=c.createGain(),w=c.createWaveShaper();w.curve=driveCurve(.8);o.frequency.setValueAtTime(220,0);o.frequency.exponentialRampToValueAtTime(48,.07);env(c,g,.001,.4);o.connect(w).connect(g).connect(c.destination);o.start()}],
   ["Snare",.4,c=>{const n=noise(c,.4),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=1200;env(c,g,.001,.22,.8);n.connect(f).connect(g).connect(c.destination);n.start();const o=c.createOscillator(),g2=c.createGain();o.frequency.setValueAtTime(240,0);o.frequency.exponentialRampToValueAtTime(160,.08);env(c,g2,.001,.12,.6);o.connect(g2).connect(c.destination);o.start()}],
   ["Clap",.4,c=>{const n=noise(c,.4),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.frequency.value=1500;f.Q.value=1.2;g.gain.setValueAtTime(0,0);[0,.012,.024].forEach(x=>{g.gain.setValueAtTime(.9,x);g.gain.exponentialRampToValueAtTime(.05,x+.01)});g.gain.setValueAtTime(.9,.036);g.gain.exponentialRampToValueAtTime(.0001,.33);n.connect(f).connect(g).connect(c.destination);n.start()}],
   ["Hat",.12,c=>{const n=noise(c,.12),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=7000;env(c,g,.001,.06,.6);n.connect(f).connect(g).connect(c.destination);n.start()}],
   ["Open hat",.5,c=>{const n=noise(c,.5),f=c.createBiquadFilter(),g=c.createGain();f.type="highpass";f.frequency.value=6500;env(c,g,.002,.4,.5);n.connect(f).connect(g).connect(c.destination);n.start()}],
   ["Rim",.15,c=>{const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=1700;env(c,g,.001,.03,.5);o.connect(g).connect(c.destination);o.start()}],
   ["Tom",.6,c=>{const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(180,0);o.frequency.exponentialRampToValueAtTime(90,.3);env(c,g,.002,.5,.9);o.connect(g).connect(c.destination);o.start()}],
   ["Sub A1",1.2,c=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=55;g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.9,.01);g.gain.setValueAtTime(.9,.9);g.gain.linearRampToValueAtTime(0,1.2);o.connect(g).connect(c.destination);o.start()}],
   ["Acid bass",.6,c=>{const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="sawtooth";o.frequency.value=55;f.type="lowpass";f.Q.value=14;f.frequency.setValueAtTime(2400,0);f.frequency.exponentialRampToValueAtTime(200,.3);env(c,g,.003,.5,.6);o.connect(f).connect(g).connect(c.destination);o.start()}],
   ["Pluck",.9,c=>{const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="square";o.frequency.value=440;f.type="lowpass";f.frequency.setValueAtTime(5000,0);f.frequency.exponentialRampToValueAtTime(400,.25);env(c,g,.002,.8,.4);o.connect(f).connect(g).connect(c.destination);o.start()}],
   ["Pad",4,c=>{const g=c.createGain(),f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=1800;g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.18,1.2);g.gain.setValueAtTime(.18,2.8);g.gain.linearRampToValueAtTime(0,4);f.connect(g).connect(c.destination);[220,261.6,329.6,392].forEach((fr,i)=>[-7,7].forEach(dt=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=fr;o.detune.value=dt;o.connect(f);o.start()}))},2],
   ["Drone",6,c=>{const g=c.createGain(),f=c.createBiquadFilter(),l=c.createOscillator(),lg=c.createGain();f.type="lowpass";f.Q.value=6;f.frequency.value=600;l.frequency.value=.15;lg.gain.value=450;l.connect(lg).connect(f.frequency);l.start();g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.3,1.5);g.gain.setValueAtTime(.3,4.5);g.gain.linearRampToValueAtTime(0,6);f.connect(g).connect(c.destination);[55,55.4,110.3,82.5].forEach(fr=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=fr;o.connect(f);o.start()})},2],
   ["Noise riser",4,c=>{const n=noise(c,4),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.Q.value=3;f.frequency.setValueAtTime(200,0);f.frequency.exponentialRampToValueAtTime(9000,3.9);g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.7,3.9);g.gain.linearRampToValueAtTime(0,4);n.connect(f).connect(g).connect(c.destination);n.start()}],
   ["Feedback",2,c=>{const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),w=c.createWaveShaper();w.curve=driveCurve(1);o.frequency.setValueAtTime(900,0);o.frequency.linearRampToValueAtTime(2400,1.8);o2.frequency.value=13;const g2=c.createGain();g2.gain.value=300;o2.connect(g2).connect(o.frequency);g.gain.setValueAtTime(0,0);g.gain.linearRampToValueAtTime(.25,.4);g.gain.linearRampToValueAtTime(0,2);o.connect(w).connect(g).connect(c.destination);o.start();o2.start()}],
   ["Crackle",3,c=>{const b=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()<.0015?(Math.random()*2-1):0;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=800;s.connect(f).connect(c.destination);s.start()}],
  ];
  for(const [n,sec,fn,ch] of list)await mk(n,sec,fn,ch||1);
}

/* ---------- playback engine ---------- */
let playing=false,recording=false,t0=0,p0=0,voices=[],chains=new Map(),schedH=null,segEnd=0,segQueue=[];
function rebuildChains(){
  const c=audio();if(!reverbIR)reverbIR=makeIR(c);
  for(const ch of chains.values())try{ch.mute.disconnect()}catch(e){}
  chains.clear();for(const tr of state.tracks)chains.set(tr.id,buildChain(c,tr,master,reverbIR));
}
function updChain(tr){const ch=chains.get(tr.id);if(!ch)return;const now=ctx.currentTime;
  ch.vol.gain.setTargetAtTime(tr.vol,now,.01);if(ch.pan)ch.pan.pan.setTargetAtTime(tr.pan,now,.01);
  ch.filt.frequency.setTargetAtTime(tr.fx.cut,now,.01);ch.filt.Q.value=tr.fx.res;ch.hp.frequency.setTargetAtTime(tr.fx.hp,now,.01);
  ch.drive.curve=driveCurve(tr.fx.drive);ch.dl.delayTime.setTargetAtTime(spb()*tr.fx.dtime,now,.02);ch.fb.gain.value=tr.fx.dfb;
  ch.dsend.gain.setTargetAtTime(tr.fx.dmix,now,.01);ch.rsend.gain.setTargetAtTime(tr.fx.rmix,now,.01);
  for(const x of state.tracks){const cx=chains.get(x.id);if(cx)cx.mute.gain.setTargetAtTime(audible(x)?1:0,now,.005)}}
function curPos(){return playing?p0+(ctx.currentTime-t0):state.pos}
/* timeline position -> context time, honours loop */
function scheduleSeg(a,b,at){
  for(const tr of state.tracks){const ch=chains.get(tr.id);if(!ch)continue;
    for(const c of tr.clips){const s=lib.get(c.snd);if(!s)continue;
      const cs=c.start,ce=c.start+c.len;if(ce<=a||cs>=b)continue;
      const from=Math.max(a,cs),to=Math.min(b,ce);
      const src=ctx.createBufferSource();src.buffer=s.buffer;
      const g=ctx.createGain();g.gain.value=c.gain??1;src.connect(g).connect(ch.input);
      const when=at+(from-a);src.start(Math.max(ctx.currentTime,when),c.off+(from-cs),to-from);
      voices.push(src);src.onended=()=>{const i=voices.indexOf(src);if(i>=0)voices.splice(i,1)};
    }}
  if(state.metro){const b0=Math.ceil(a/spb()-1e-6);for(let k=b0;k*spb()<b;k++){const tt=at+(k*spb()-a);const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=k%4===0?1600:1000;g.gain.setValueAtTime(.25,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.05);o.connect(g).connect(master);o.start(tt);o.stop(tt+.06);voices.push(o)}}
}
function play(from){
  audio();rebuildChains();
  playing=true;p0=from??state.pos;t0=ctx.currentTime+.05;
  const end=Math.max(projEnd(),p0)+ (recording?600:0);
  if(state.loop&&state.loopB>state.loopA&&!recording){
    if(p0>=state.loopB||p0<state.loopA)p0=state.loopA;
    scheduleSeg(p0,state.loopB,t0);segEnd=t0+(state.loopB-p0);
    schedH=setInterval(()=>{if(segEnd-ctx.currentTime<1){scheduleSeg(state.loopA,state.loopB,segEnd);segQueue.push(segEnd);segEnd+=state.loopB-state.loopA}},100);
  }else{scheduleSeg(p0,end,t0);segEnd=t0+(end-p0)}
  $("#bPlay").classList.add("on");$("#bPlay").firstChild.replaceWith(icon("stop"));
}
function stop(keep){
  if(!playing)return;
  const pos=displayPos();
  for(const v of voices)try{v.stop()}catch(e){}voices=[];clearInterval(schedH);segQueue=[];
  playing=false;state.pos=keep?state.pos:(recording?pos:pos);
  if(recording)stopRec();
  $("#bPlay").classList.remove("on");$("#bPlay").firstChild.replaceWith(icon("play"));
}
function displayPos(){
  if(!playing)return state.pos;
  let p=p0+(ctx.currentTime-t0);
  if(state.loop&&!recording&&state.loopB>state.loopA&&p>=state.loopB){p=state.loopA+((p-state.loopB)%(state.loopB-state.loopA))}
  return Math.max(0,p);
}
function restartIfPlaying(){if(playing&&!recording){const p=displayPos();stop(true);state.pos=p;play(p)}}

/* ---------- recording ---------- */
let mediaRec=null,recChunks=[],recStartPos=0,recStream=null;
async function startRec(){
  const tr=state.tracks.find(x=>x.id===state.armed);if(!tr){toast(t("arm"));return}
  audio();
  try{recStream=recStream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){toast(t("mic"));return}
  recChunks=[];mediaRec=new MediaRecorder(recStream);mediaRec.ondataavailable=e=>e.data.size&&recChunks.push(e.data);
  mediaRec.onstop=async()=>{
    const blob=new Blob(recChunks,{type:mediaRec.mimeType});
    try{const buf=await ctx.decodeAudioData(await blob.arrayBuffer());
      const lat=(ctx.outputLatency||ctx.baseLatency||0);
      const s=addSound({id:"rec:"+uid(),name:"Rec "+(d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"))(new Date()),buffer:buf,src:"rec"});storeSound(s);
      snapshot();tr.clips.push({id:uid(),snd:s.id,start:recStartPos,off:Math.min(lat,buf.duration/2),len:Math.max(.05,buf.duration-lat),gain:1});
      renderMine();render();save();
    }catch(e){console.warn(e)}
  };
  recording=true;$("#bRec").classList.add("on");
  recStartPos=state.pos;play(state.pos);
  setTimeout(()=>mediaRec&&mediaRec.state==="inactive"&&mediaRec.start(),45);
}
function stopRec(){recording=false;$("#bRec").classList.remove("on");if(mediaRec&&mediaRec.state!=="inactive")mediaRec.stop()}

/* ---------- export ---------- */
async function exportWav(){
  const end=projEnd();if(!end)return;
  const SR=44100,len=Math.ceil((end+3)*SR);
  const oc=new OfflineAudioContext(2,len,SR);const ir=makeIR(oc);const m=oc.createGain();m.connect(oc.destination);
  const used=new Set();
  for(const tr of state.tracks){const ch=buildChain(oc,tr,m,ir);
    for(const c of tr.clips){const s=lib.get(c.snd);if(!s)continue;used.add(s);const src=oc.createBufferSource();src.buffer=s.buffer;const g=oc.createGain();g.gain.value=c.gain??1;src.connect(g).connect(ch.input);src.start(c.start,c.off,c.len)}}
  $("#status").textContent="…";
  const b=await oc.startRendering();
  const name="studio-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  download(wavBlob(b),name+".wav");
  const cred=[...used].filter(s=>s.credit);
  if(cred.length){const txt=(lang==="fr"?"Sons utilisés":"Sounds used")+"\n\n"+cred.map(s=>`"${s.credit.title}" by ${s.credit.author} — ${s.credit.license} — ${s.credit.url}`).join("\n")+"\n";download(new Blob([txt],{type:"text/plain"}),name+"-credits.txt")}
  $("#status").textContent="";toast(t("exported"));
}
function wavBlob(b){const nc=b.numberOfChannels,n=b.length,ab=new ArrayBuffer(44+n*nc*2),v=new DataView(ab);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*nc*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*nc*2,true);v.setUint16(32,nc*2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*nc*2,true);
  const ch=[];for(let c=0;c<nc;c++)ch.push(b.getChannelData(c));let o=44;
  for(let i=0;i<n;i++)for(let c=0;c<nc;c++){const s=Math.max(-1,Math.min(1,ch[c][i]));v.setInt16(o,s<0?s*0x8000:s*0x7fff,true);o+=2}
  return new Blob([ab],{type:"audio/wav"})}
function download(blob,name){const a=el("a",{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ---------- Freesound ---------- */
const fsKey=()=>localStorage.getItem("st.fskey")||"";
function fsURL(q,page){
  const fields="id,name,username,license,duration,previews,url";
  const filter='license:("Creative Commons 0" OR "Attribution")';
  const qs=`query=${encodeURIComponent(q)}&page=${page}&page_size=30&fields=${fields}&filter=${encodeURIComponent(filter)}`;
  if(FS_PROXY)return `${FS_PROXY}/search?${qs}`;
  return `https://freesound.org/apiv2/search/text/?${qs}&token=${encodeURIComponent(fsKey())}`;
}
const licName=l=>/publicdomain\/zero|Creative Commons 0/i.test(l)?"CC0":/by-nc/i.test(l)?"CC BY-NC":/by\//i.test(l)||/Attribution/i.test(l)?"CC BY":l;
let fsPage=1,fsQuery="";
async function fsSearch(q,more){
  if(!FS_PROXY&&!fsKey()){$("#fsList").replaceChildren(el("div",{class:"note"},t("noKey")));return}
  if(!more){fsPage=1;fsQuery=q;$("#fsList").replaceChildren(el("div",{class:"note"},"…"))}
  try{const r=await fetch(fsURL(fsQuery,fsPage));if(!r.ok)throw new Error(r.status);const j=await r.json();
    if(!more)$("#fsList").replaceChildren(el("div",{class:"note"},t("licence")));
    $("#fsList").querySelector(".more")?.remove();
    if(!j.results.length&&!more){$("#fsList").append(el("div",{class:"note"},t("nores")));return}
    for(const x of j.results){
      const item={id:"fs:"+x.id,name:x.name,src:"freesound",remote:x.previews["preview-hq-mp3"],dur:x.duration,
        credit:{title:x.name,author:x.username,license:licName(x.license),url:x.url||`https://freesound.org/s/${x.id}/`}};
      $("#fsList").append(sndRow(item));
    }
    if(j.next){fsPage++;$("#fsList").append(el("button",{class:"more",onclick:()=>fsSearch(fsQuery,true)},"+"))}
  }catch(e){$("#fsList").replaceChildren(el("div",{class:"note"},t("fsErr")))}
}
async function ensureSound(item){
  if(lib.has(item.id))return lib.get(item.id);
  const st=await dbGet("snd",item.id).catch(()=>null);
  if(st){const c=audio();const b=c.createBuffer(st.chans.length,st.chans[0].length,st.sr);st.chans.forEach((d,i)=>b.copyToChannel(d,i));return addSound({id:st.id,name:st.name,buffer:b,src:st.src,credit:st.credit})}
  if(!item.remote)return null;
  const url=FS_PROXY&&item.src==="freesound"?`${FS_PROXY}/preview?u=${encodeURIComponent(item.remote)}`:item.remote;
  const ab=await (await fetch(url)).arrayBuffer();let b=await audio().decodeAudioData(ab);b=trimBuf(b,240);
  const s=addSound({id:item.id,name:item.name,buffer:b,src:item.src,credit:item.credit});storeSound(s);renderMine();return s;
}

function trimBuf(b,max){if(b.duration<=max)return b;const n=Math.floor(max*b.sampleRate),o=audio().createBuffer(b.numberOfChannels,n,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)o.copyToChannel(b.getChannelData(c).subarray(0,n),c);return o}
/* ---------- Internet Archive ---------- */
const IA_CATS={en:[["Field","subject:(\"field recording\" OR \"field recordings\" OR soundscape)"],["Ethno","subject:(ethnographic OR ethnography OR ethnomusicology)"],["Trad","subject:(\"traditional music\" OR \"folk music\" OR folklore OR \"folk songs\")"],["Chants","subject:(chant OR chants OR \"work song\" OR lullaby OR ballad)"],["Jazz","subject:(jazz OR ragtime OR blues)"],["Classical","subject:(classical OR symphony OR orchestra OR piano OR opera)"],["Concert","subject:(concert OR live)"],["Oral","subject:(\"oral history\" OR interview OR sociology)"],["Nature","subject:(birds OR bioacoustics OR animals OR insects)"],["City","subject:(city OR street OR market OR traffic OR station)"]]};
IA_CATS.fr=IA_CATS.en.map(([n,q])=>[{Field:"Terrain",Trad:"Trad",Chants:"Chants",Classical:"Classique",Oral:"Enquêtes",City:"Ville"}[n]||n,q]);
const IA_LIC=/publicdomain|\/zero\/|\/by\/|\/by-sa\//;
const IA_SKIP='-collection:(78rpm OR roiocollection OR podcasts_mirror OR podcasts_mirror_gnuarchives)';
const iaLic=u=>/zero/.test(u)?"CC0":/publicdomain/.test(u)?"PD":/by-sa/.test(u)?"CC BY-SA":"CC BY";
let iaCat=null,iaPage=1,iaQ="";
function renderIaCats(){$("#iaCats").replaceChildren(...IA_CATS[lang].map(([n,q],i)=>{const b=el("button",{class:iaCat===i?"on":""},n);b.onclick=()=>{iaCat=iaCat===i?null:i;renderIaCats();iaSearch($("#iaQ").value.trim())};return b}))}
async function iaSearch(q,more){
  if(!more){iaPage=1;iaQ=q}
  const parts=["mediatype:audio","licenseurl:*",IA_SKIP];if(iaQ)parts.push("("+iaQ+")");if(iaCat!==null)parts.push(IA_CATS.en[iaCat][1]);
  if(!iaQ&&iaCat===null)return;

    state.tracks[3].fx.rmix=.5;state.loop=true;state.loopA=0;state.loopB=bar()*4;$("#bLoop").classList.add("on")}
  render();requestAnimationFrame(frame);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
